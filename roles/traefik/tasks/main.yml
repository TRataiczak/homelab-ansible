- name: Create Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ traefik_dir }}"
    - "{{ traefik_dir }}/letsencrypt"

- name: Write Traefik secrets file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ traefik_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write Traefik compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Start Traefik
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: present