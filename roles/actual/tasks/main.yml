- name: Create Actual directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ actual_dir }}"
    - "{{ actual_dir }}/data"

- name: Write Actual compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ actual_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Start Actual
  community.docker.docker_compose_v2:
    project_src: "{{ actual_dir }}"
    state: present