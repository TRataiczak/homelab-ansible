- name: Install base packages
  ansible.builtin.apt:
    pkg: "{{ common_packages }}"
    update_cache: yes

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Set device hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Turn on automatic daily updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Make sure unattended-upgrades is running
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true

- name: Harden SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    owner: root
    group: root
    mode: "0644"
    validate: sshd -t -f %s
  notify: Restart ssh

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow extra ports for this server
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ common_firewall_ports }}"

- name: Deny incoming by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Allow outgoing by default
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable firewall
  community.general.ufw:
    state: enabled